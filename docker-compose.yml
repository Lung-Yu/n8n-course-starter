version: "3.8"

# TSMC n8n AI 實戰班 — 學員環境
# 使用方式：
#   1. 複製 .env.example 為 .env，填入你的學員編號（N8N_PORT_OFFSET）
#   2. docker compose up -d
#   3. 打開瀏覽器 http://localhost:<N8N_PORT>

services:
  n8n:
    # 課程所有測試紀錄與 n8n 2.21.7 限制文件都是針對這個版本驗證的，不要用 latest
    image: n8nio/n8n:2.21.7
    container_name: n8n-student
    restart: unless-stopped
    ports:
      # 預設 port 5678；每位學員用不同的 port（老師課前分配）
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-tsmc2026}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=Asia/Taipei
      - TZ=Asia/Taipei
      # Gemini API Key（Day 2 使用，可留空，在 n8n 介面設定）
      - GOOGLE_GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - lab-network
    extra_hosts:
      # workflow JSON 全部寫死呼叫 host.containers.internal（Podman 慣例）；
      # Docker（含 Docker Desktop）本身不解析這個名稱，用 extra_hosts 補上，
      # 兩種 runtime 都能跑，不用改任何 workflow JSON
      - "host.containers.internal:host-gateway"

  # Qdrant 向量資料庫（Day 2 RAG Demo 使用）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-lab
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - lab-network

  # Mock API Server（設備狀態/告警/工單/事件，workflow 全部寫死呼叫 3001）
  mock-api:
    image: node:20-alpine
    container_name: mock-api-lab
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./mock-api:/app
    working_dir: /app
    environment:
      - PORT=3001
    command: node server.js
    networks:
      - lab-network

volumes:
  n8n_data:
  qdrant_data:

networks:
  lab-network:
    driver: bridge
